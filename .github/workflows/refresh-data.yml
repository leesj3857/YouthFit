name: 정책 데이터 갱신

on:
  schedule:
    - cron: "0 20 * * *"   # 매일 05:00 KST (팀 백엔드 04:00 수집 이후)
  workflow_dispatch:        # Actions 탭에서 수동 실행

permissions:
  contents: write

concurrency:
  group: refresh-data
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r pipeline/requirements.txt

      - name: 새로 생기거나 바뀐 정책 정형화 → src/data 갱신
        working-directory: pipeline
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: python refresh.py

      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: 검색 임베딩 다시 만들기 (정책 데이터가 바뀐 날만)
        run: |
         if git diff --quiet -- src/data/policies.json; then echo "정책 데이터 변경 없음"; else node scripts/build-embeddings.mjs; fi

      - name: 바뀐 데이터 커밋 (Vercel이 자동 재배포)
        run: |
          git config user.name "youthfit-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/data pipeline/data
          if git diff --cached --quiet; then
            echo "변경 없음"
          else
            git commit -m "데이터 자동 갱신 $(date -u +%F)"
            git push
          fi
